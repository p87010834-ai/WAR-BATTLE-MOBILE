name: Godot validation and Android APK

on:
  push:
    branches: [godot-migration]
    paths:
      - "godot/**"
      - ".github/workflows/godot-check.yml"
  pull_request:
    branches: [godot-migration]
    paths:
      - "godot/**"
      - ".github/workflows/godot-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-export-android:
    name: Validate Godot and export Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Import, validate and export Android debug APK
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          relative_project_path: godot
          presets_to_export: Android
          use_preset_export_path: true
          export_debug: true
          cache: true
          verbose: true

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: WAR-BATTLE-MOBILE-Android-debug
          path: godot/build/WAR_BATTLE_MOBILE.apk
          if-no-files-found: error
          retention-days: 14
