name: Godot Android build

on:
  push:
    branches: [godot-migration]
    paths:
      - "godot/**"
      - ".github/workflows/godot-android-build.yml"
  pull_request:
    branches: [godot-migration]
    paths:
      - "godot/**"
      - ".github/workflows/godot-android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Validate and export Android APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"

      - name: Install Godot 4.4.1 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF

      - name: Create temporary debug signing key
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.android"
          keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Import and parse Godot project
        run: godot --headless --editor --path godot --quit

      - name: Run headless smoke test
        run: godot --headless --path godot --quit-after 5

      - name: Export debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p godot/build
          godot --headless --path godot --export-debug "Android" "$GITHUB_WORKSPACE/godot/build/WAR_BATTLE_MOBILE.apk"
          test -s "$GITHUB_WORKSPACE/godot/build/WAR_BATTLE_MOBILE.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WAR-BATTLE-MOBILE-Android-debug
          path: godot/build/WAR_BATTLE_MOBILE.apk
          if-no-files-found: error
          retention-days: 14
